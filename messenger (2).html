<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زارت · پیام‌رسان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#080a14;
    --bg-panel: rgba(20,23,40,0.66);
    --bg-panel-solid:#12162a;
    --stroke: rgba(255,255,255,0.08);
    --accent-1:#7c5cff;
    --accent-2:#00d4ff;
    --accent-grad: linear-gradient(135deg,#7c5cff 0%, #4f7bff 55%, #00d4ff 100%);
    --text-1:#f1f3fb;
    --text-2:#9298b3;
    --text-3:#5c6280;
    --bubble-them:#181d34;
    --online:#3ee089;
    --danger:#ff5c7a;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Vazirmatn', sans-serif;
    background: var(--bg-deep);
    color: var(--text-1);
    overflow:hidden;
    position:relative;
  }

  /* ---------- Aurora signature background ---------- */
  .aurora{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .aurora span{
    position:absolute; border-radius:50%;
    filter: blur(90px);
    opacity:0.35;
    mix-blend-mode: screen;
  }
  .aurora span:nth-child(1){
    width:520px; height:520px; background:#7c5cff;
    top:-160px; right:-120px;
    animation: float1 22s ease-in-out infinite;
  }
  .aurora span:nth-child(2){
    width:460px; height:460px; background:#00d4ff;
    bottom:-160px; left:-100px;
    animation: float2 26s ease-in-out infinite;
  }
  .aurora span:nth-child(3){
    width:340px; height:340px; background:#ff5c9d;
    top:40%; left:35%;
    opacity:0.16;
    animation: float3 30s ease-in-out infinite;
  }
  @keyframes float1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-60px,80px) scale(1.15); }
  }
  @keyframes float2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(70px,-60px) scale(1.1); }
  }
  @keyframes float3{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(40px,40px) scale(0.9); }
  }
  @media (prefers-reduced-motion: reduce){
    .aurora span{ animation:none !important; }
  }

  /* ---------- App shell ---------- */
  .app{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns: 360px 1fr;
    height:100vh;
    max-width:1400px;
    margin:0 auto;
    padding:18px;
    gap:18px;
  }

  .panel{
    background: var(--bg-panel);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border:1px solid var(--stroke);
    border-radius: var(--radius-lg);
    display:flex; flex-direction:column;
    overflow:hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  /* ---------- Sidebar ---------- */
  .sidebar-head{
    padding:20px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--stroke);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:19px; letter-spacing:0.2px;
  }
  .brand-mark{
    width:34px; height:34px; border-radius:11px;
    background: var(--accent-grad);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:800; color:#fff;
    box-shadow: 0 6px 18px rgba(124,92,255,0.45);
  }
  .icon-btn{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.04);
    border:1px solid var(--stroke);
    color: var(--text-2);
    cursor:pointer;
    transition: all .18s ease;
  }
  .icon-btn:hover{ background: rgba(255,255,255,0.09); color:var(--text-1); }

  .search-wrap{ padding:14px 16px; }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.04);
    border:1px solid var(--stroke);
    border-radius: 999px;
    padding:9px 14px;
  }
  .search-box input{
    background:none; border:none; outline:none;
    color:var(--text-1); font-family:inherit; font-size:14px; width:100%;
  }
  .search-box input::placeholder{ color:var(--text-3); }
  .search-box svg{ flex-shrink:0; opacity:0.6; }

  .chat-list{
    flex:1; overflow-y:auto; padding:4px 10px 14px;
  }
  .chat-item{
    display:flex; align-items:center; gap:12px;
    padding:11px 10px;
    border-radius: var(--radius-md);
    cursor:pointer;
    transition: background .15s ease;
    position:relative;
  }
  .chat-item:hover{ background: rgba(255,255,255,0.045); }
  .chat-item.active{ background: rgba(124,92,255,0.16); }
  .chat-item.active::before{
    content:'';
    position:absolute; right:0; top:14%; bottom:14%; width:3px;
    background: var(--accent-grad); border-radius:3px;
  }

  .avatar{
    position:relative; flex-shrink:0;
    width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:16px; color:#fff;
  }
  .avatar .dot{
    position:absolute; bottom:0; left:0;
    width:12px; height:12px; border-radius:50%;
    background: var(--online);
    border:2.5px solid var(--bg-panel-solid);
  }

  .chat-meta{ flex:1; min-width:0; }
  .chat-meta-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .chat-name{ font-size:14.5px; font-weight:600; color:var(--text-1); }
  .chat-time{ font-size:11.5px; color:var(--text-3); flex-shrink:0; }
  .chat-preview{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    margin-top:3px;
  }
  .chat-last{
    font-size:13px; color:var(--text-2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .badge{
    background: var(--accent-grad);
    color:#fff; font-size:11px; font-weight:700;
    min-width:20px; height:20px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    padding:0 6px; flex-shrink:0;
  }

  /* ---------- Chat panel ---------- */
  .chat-panel{ display:flex; flex-direction:column; }
  .chat-head{
    padding:14px 22px;
    display:flex; align-items:center; gap:12px;
    border-bottom:1px solid var(--stroke);
  }
  .chat-head .info{ flex:1; min-width:0; }
  .chat-head .name{ font-size:15px; font-weight:700; }
  .chat-head .status{ font-size:12.5px; color: var(--online); margin-top:2px; }
  .chat-head .status.offline{ color: var(--text-3); }
  .head-actions{ display:flex; gap:8px; align-items:center; }
  .streak-pill{
    display:flex; align-items:center; justify-content:center; gap:4px;
    min-width:46px; padding:6px 8px; border-radius:999px;
    background: rgba(255,166,0,0.12); border:1px solid rgba(255,166,0,0.4);
    color: #ffb648; font-size:12px; font-weight:800; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .streak-flame{
    display:inline-flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%;
    background: linear-gradient(180deg,#ffbf6d,#ff7d2a); color:#fff;
    font-size:11px; box-shadow: 0 6px 12px rgba(255,122,34,0.35);
  }
  .messages{
    flex:1; overflow-y:auto;
    padding:26px 30px;
    display:flex; flex-direction:column; gap:4px;
  }
  .day-divider{
    align-self:center;
    font-size:11.5px; color:var(--text-3);
    background: rgba(255,255,255,0.04);
    padding:5px 14px; border-radius:999px;
    margin: 14px 0 18px;
  }

  .msg-row{ display:flex; margin-bottom:2px; }
  .msg-row.me{ justify-content:flex-start; flex-direction:row-reverse; }
  .msg-row.them{ justify-content:flex-start; }

  .bubble{
    max-width:62%;
    padding:10px 15px 8px;
    font-size:14.5px; line-height:1.65;
    position:relative;
    animation: pop .22s ease;
  }
  @keyframes pop{
    from{ opacity:0; transform: translateY(6px) scale(0.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .msg-row.me .bubble{
    background: var(--accent-grad);
    color:#fff;
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 6px 16px rgba(124,92,255,0.28);
  }
  .msg-row.them .bubble{
    background: var(--bubble-them);
    border:1px solid var(--stroke);
    border-radius: 18px 18px 18px 4px;
  }
  .bubble .txt{ word-wrap:break-word; }
  .bubble .meta{
    display:flex; justify-content:flex-end; align-items:center; gap:4px;
    margin-top:4px; font-size:10.5px; opacity:0.75;
  }
  .msg-row.them .bubble .meta{ color:var(--text-3); }

  .typing-row .bubble{
    display:flex; align-items:center; gap:4px; padding:14px 16px;
  }
  .typing-dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--text-2);
    animation: blink 1.2s infinite;
  }
  .typing-dot:nth-child(2){ animation-delay:0.2s; }
  .typing-dot:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{
    0%,60%,100%{ opacity:0.3; transform: translateY(0); }
    30%{ opacity:1; transform: translateY(-3px); }
  }

  .composer{
    padding:16px 22px 20px;
    border-top:1px solid var(--stroke);
    display:flex; align-items:flex-end; gap:10px;
  }
  .composer-box{
    flex:1;
    background: rgba(255,255,255,0.045);
    border:1px solid var(--stroke);
    border-radius: 20px;
    padding:11px 16px;
    display:flex; align-items:center;
  }
  .composer-box textarea{
    flex:1; resize:none; background:none; border:none; outline:none;
    color:var(--text-1); font-family:inherit; font-size:14.5px;
    max-height:120px; line-height:1.5;
  }
  .composer-box textarea::placeholder{ color:var(--text-3); }

  .send-btn{
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    background: var(--accent-grad);
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px rgba(124,92,255,0.4);
    transition: transform .15s ease;
  }
  .send-btn:hover{ transform: scale(1.06); }
  .send-btn:active{ transform: scale(0.94); }

  .channel-readonly-notice{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:16px 22px 22px;
    color:var(--text-3); font-size:13px;
  }

  /* scrollbars */
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.12); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ---------- Bottom glass nav (Telegram-style) ---------- */
  .bottom-nav{
    position:absolute;
    bottom:16px; left:50%; transform:translateX(-50%);
    z-index:10;
    display:flex; gap:8px;
    padding:8px;
    background: rgba(30,32,50,0.55);
    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    border:1px solid rgba(255,255,255,0.12);
    border-radius: 26px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .nav-btn{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px;
    width:88px; padding:10px 8px 9px;
    border-radius:19px;
    cursor:pointer;
    color: var(--text-2);
    transition: background .2s ease, color .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn svg{ transition: transform .2s ease; }
  .nav-btn .nav-label{ font-size:11.5px; font-weight:700; }
  .nav-btn:hover{ background: rgba(255,255,255,0.05); }
  .nav-btn.active{
    background: rgba(255,255,255,0.09);
    color: var(--accent-2);
  }
  .nav-btn.active svg{ transform: translateY(-1px) scale(1.05); }
  .nav-badge{
    position:absolute; top:2px; left:14px;
    background: var(--danger);
    color:#fff; font-size:10.5px; font-weight:800;
    min-width:19px; height:19px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    padding:0 5px;
    box-shadow: 0 4px 10px rgba(255,92,122,0.5);
    border: 2px solid rgba(30,32,50,0.9);
  }

  .sidebar{ position:relative; }
  .sidebar-scroll{ flex:1; overflow-y:auto; padding-bottom:78px; display:flex; flex-direction:column; }

  /* ---------- Settings / Profile / Theme views ---------- */
  .settings-view{
    position:absolute; inset:0; z-index:5;
    background: var(--bg-panel-solid);
    display:flex; flex-direction:column;
    animation: slideIn .22s ease;
  }
  @keyframes slideIn{
    from{ opacity:0; transform: translateX(14px); }
    to{ opacity:1; transform: translateX(0); }
  }
  .settings-head{
    display:flex; align-items:center; gap:12px;
    padding:20px 20px 16px;
    border-bottom:1px solid var(--stroke);
  }
  .settings-head .title{ font-size:17px; font-weight:800; flex:1; }
  .settings-body{ flex:1; overflow-y:auto; padding:18px 18px 90px; }

  .settings-group{
    background: rgba(255,255,255,0.03);
    border:1px solid var(--stroke);
    border-radius: var(--radius-md);
    overflow:hidden;
    margin-bottom:18px;
  }
  .settings-row{
    display:flex; align-items:center; gap:14px;
    padding:15px 16px;
    cursor:pointer;
    transition: background .15s ease;
    border-bottom:1px solid var(--stroke);
  }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row:hover{ background: rgba(255,255,255,0.04); }
  .settings-row .row-icon{
    width:38px; height:38px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; flex-shrink:0;
  }
  .settings-row .row-text{ flex:1; min-width:0; }
  .settings-row .row-title{ font-size:14.5px; font-weight:600; }
  .settings-row .row-sub{ font-size:12px; color:var(--text-3); margin-top:1px; }
  .settings-row .row-chevron{ color:var(--text-3); flex-shrink:0; transform:scaleX(-1); }

  /* profile edit */
  .profile-edit-top{ display:flex; flex-direction:column; align-items:center; padding:10px 0 22px; }
  .avatar-edit-wrap{ position:relative; width:100px; height:100px; }
  .avatar-edit-wrap .avatar{ width:100px; height:100px; font-size:34px; background-size:cover; background-position:center; }
  .avatar-edit-btn{
    position:absolute; bottom:-2px; left:-2px;
    width:32px; height:32px; border-radius:50%;
    background: var(--accent-grad);
    display:flex; align-items:center; justify-content:center;
    color:#fff; cursor:pointer;
    border:3px solid var(--bg-panel-solid);
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
  }
  .avatar-color-picker{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    margin-top:16px; padding:14px; width:100%;
    background: rgba(255,255,255,0.03);
    border:1px solid var(--stroke);
    border-radius: var(--radius-md);
  }
  .swatch{
    width:38px; height:38px; border-radius:50%;
    cursor:pointer; border:2.5px solid transparent;
    transition: transform .15s ease, border-color .15s ease;
    flex-shrink:0;
  }
  .swatch:hover{ transform: scale(1.08); }
  .swatch.selected{ border-color:#fff; transform: scale(1.08); }

  .field-group{ margin-bottom:14px; }
  .field-label{ font-size:12.5px; color:var(--text-3); margin-bottom:7px; display:block; }
  .field-input-wrap{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.04);
    border:1px solid var(--stroke);
    border-radius: var(--radius-md);
    padding:12px 14px;
  }
  .field-input-wrap.id-field{ direction:ltr; }
  .field-input-wrap span.at{ color:var(--text-3); font-weight:700; flex-shrink:0; }
  .field-input-wrap input{
    flex:1; background:none; border:none; outline:none;
    color:var(--text-1); font-family:inherit; font-size:14.5px;
    min-width:0;
  }
  .field-hint{ font-size:11.5px; color:var(--text-3); margin-top:6px; padding:0 2px; }
  .field-hint.taken{ color:var(--danger); }
  .field-hint.ok{ color:var(--online); }

  .settings-save-btn{
    width:100%; margin-top:6px;
    padding:13px; border-radius: var(--radius-md);
    border:none; cursor:pointer;
    background: var(--accent-grad); color:#fff;
    font-family:inherit; font-size:14.5px; font-weight:700;
    box-shadow: 0 8px 20px rgba(124,92,255,0.35);
    transition: filter .15s ease, transform .1s ease;
  }
  .settings-save-btn:hover{ filter:brightness(1.08); }
  .settings-save-btn:active{ transform: scale(0.98); }
  .settings-save-btn:disabled{ opacity:0.5; cursor:not-allowed; filter:none; }

  .settings-save-btn.ghost-danger{
    background: rgba(255,92,122,0.12);
    color: var(--danger);
    box-shadow:none;
    border:1.5px solid rgba(255,92,122,0.3);
  }
  .settings-save-btn.ghost-danger:hover{ background: rgba(255,92,122,0.2); filter:none; }

  .hidden-file-input{ display:none; }

  .radio-group{ display:flex; flex-direction:column; gap:10px; }
  .radio-option{
    display:flex; align-items:center; gap:12px;
    padding:13px 14px;
    background: rgba(255,255,255,0.03);
    border:1.5px solid var(--stroke);
    border-radius: var(--radius-md);
    cursor:pointer;
    transition: all .15s ease;
  }
  .radio-option.selected{ border-color: var(--accent-2); background: rgba(0,212,255,0.06); }
  .radio-option .radio-dot{
    width:20px; height:20px; border-radius:50%;
    border:2px solid var(--text-3); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .15s ease;
  }
  .radio-option.selected .radio-dot{ border-color: var(--accent-2); }
  .radio-option .radio-dot::after{
    content:''; width:10px; height:10px; border-radius:50%;
    background: var(--accent-2); opacity:0; transition: opacity .15s ease;
  }
  .radio-option.selected .radio-dot::after{ opacity:1; }
  .radio-option .radio-text .radio-title{ font-size:14px; font-weight:700; }
  .radio-option .radio-text .radio-sub{ font-size:12px; color:var(--text-3); margin-top:2px; }

  .id-random-row{ display:flex; gap:8px; margin-top:8px; }
  .id-random-row button{
    flex-shrink:0; padding:0 14px; border-radius: var(--radius-md);
    border:1px solid var(--stroke); background: rgba(255,255,255,0.05);
    color:var(--text-1); font-family:inherit; font-size:12.5px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:6px;
    transition: background .15s ease;
  }
  .id-random-row button:hover{ background: rgba(255,255,255,0.1); }

  .member-type-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .type-tab{
    flex:1; text-align:center; padding:11px; border-radius: var(--radius-md);
    background: rgba(255,255,255,0.03); border:1.5px solid var(--stroke);
    cursor:pointer; font-size:13.5px; font-weight:700; color:var(--text-2);
    transition: all .15s ease;
  }
  .type-tab.selected{ background: var(--accent-grad); color:#fff; border-color:transparent; }

  .save-toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background: var(--online); color:#08210f;
    font-size:13px; font-weight:700;
    padding:10px 20px; border-radius:999px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.4);
    z-index:80;
    animation: toastPop .25s ease;
  }
  @keyframes toastPop{
    from{ opacity:0; transform: translateX(-50%) translateY(10px); }
    to{ opacity:1; transform: translateX(-50%) translateY(0); }
  }

  /* theme edit */
  .theme-section-title{
    font-size:12.5px; color:var(--text-3); font-weight:700;
    margin: 4px 4px 10px;
  }
  .theme-swatch-grid{
    display:grid; grid-template-columns: repeat(4,1fr); gap:12px;
    margin-bottom:24px;
  }
  .theme-swatch{
    aspect-ratio:1; border-radius: var(--radius-md);
    cursor:pointer; position:relative;
    border:2.5px solid transparent;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:8px;
    transition: transform .15s ease, border-color .15s ease;
    overflow:hidden;
  }
  .theme-swatch:hover{ transform: translateY(-2px); }
  .theme-swatch.selected{ border-color:#fff; }
  .theme-swatch .check{
    width:22px; height:22px; border-radius:50%;
    background: rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
    color:#fff; opacity:0; transition: opacity .15s ease;
  }
  .theme-swatch.selected .check{ opacity:1; }

  .bg-swatch-grid{
    display:grid; grid-template-columns: repeat(4,1fr); gap:12px;
  }
  .bg-swatch{

function dayKey(date){
  const d = new Date(date);
  d.setHours(0,0,0,0);
  return d.getTime();
}

function updateChatStreak(c, now = new Date()) {
  if(!c || c.isGroup) {
    c.streak = 0;
    c.lastStreakDate = null;
    return 0;
  }

  const today = dayKey(now);
  const yesterday = dayKey(new Date(now.getTime() - 86400000));

  if(!c.lastStreakDate){
    c.streak = 0;
    return 0;
  }

  const last = Number(c.lastStreakDate);
  if(last !== today && last !== yesterday){
    c.streak = 0;
    c.lastStreakDate = null;
    return 0;
  }

  return Number(c.streak || 0);
}

function applyMessageStreak(c, now = new Date()) {
  if(!c || c.isGroup) return 0;
  const today = dayKey(now);
  const yesterday = dayKey(new Date(now.getTime() - 86400000));
  const last = c.lastStreakDate ? Number(c.lastStreakDate) : null;

  if(last === today){
    c.streak = Math.max(1, Number(c.streak || 1));
  } else if(last === yesterday){
    c.streak = Math.max(1, Number(c.streak || 0) + 1);
  } else {
    c.streak = 1;
  }

  c.lastStreakDate = today;
  return Number(c.streak || 0);
}

function syncStreaks(){
  const now = new Date();
  chats.forEach(c => {
    if(c && !c.isGroup){
      const last = c.lastStreakDate ? Number(c.lastStreakDate) : null;
      const today = dayKey(now);
      const yesterday = dayKey(new Date(now.getTime() - 86400000));
      if(last !== null && last !== today && last !== yesterday){
        c.streak = 0;
        c.lastStreakDate = null;
      }
    }
  });
}

function renderMessages(c){
  const wrap = document.getElementById('messages');
  if(!wrap) return;
  wrap.innerHTML = '<div class="day-divider">امروز</div>';

          <div class="meta">${m.time}${m.from==='me' ? ' · ✓✓' : ''}</div>
        </div>
      </div>
    `;
  });
  wrap.scrollTop = wrap.scrollHeight;
}

function sendMessage(c, input){
  const text = input.value.trim();
  if(!text) return;

  // فقط ادمین/مدیر می‌تواند در کانال پیام ارسال کند
  if(c.type === 'channel' && !c.isAdmin){
    showToast('فقط ادمین کانال می‌تواند پیام ارسال کند');
    return;
  }
  if(!c.isGroup && c.blocked){
    showToast('این کاربر مسدود است');
    return;
  }

  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  if(!c.isGroup){
    c.blocked = !!c.blocked;
    c.lastStreakDate = c.lastStreakDate ? Number(c.lastStreakDate) : null;
    applyMessageStreak(c, now);
  }
  c.messages.push({from:'me', text, time, date: now.toISOString()});
  input.value='';
  input.style.height='auto';
  persistChats();
  renderMessages(c);
  renderChatList(document.getElementById('searchInput').value);
  renderChatPanel(c);
}

          <div class="field-input-wrap">
            <input id="newBioInput" type="text" maxlength="80" placeholder="یک توضیح کوتاه..." />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">نوع ${isChannel ? 'کانال' : 'گروه'}</label>
          <div class="radio-group">
            <div class="radio-option selected" id="optPublic">
              <div class="radio-dot"></div>
              <div class="radio-text">
                <div class="radio-title">عمومی</div>
                <div class="radio-sub">هر کسی با آیدی می‌تواند پیدا و عضو شود</div>
              </div>
            </div>
            <div class="radio-option" id="optPrivate">
              <div class="radio-dot"></div>
              <div class="radio-text">
                <div class="radio-title">خصوصی</div>
                <div class="radio-sub">فقط با لینک دعوت می‌توان عضو شد</div>
              </div>
            </div>
          </div>
        </div>

        <div class="field-group" id="idFieldGroup">
          <label class="field-label" id="idFieldLabel">آیدی عمومی</label>
          <div class="field-input-wrap id-field">
            <span class="at">@</span>
            <input id="newIdInput" type="text" maxlength="28" dir="ltr" value="${state.customId}" />
          </div>
          <div class="field-hint" id="newIdHint">آیدی باید یکتا باشد؛ حروف انگلیسی، عدد و آندرلاین</div>
          <div class="id-suggest-chip" id="reRandomBtn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            پیشنهاد آیدی تصادفی جدید
          </div>
        </div>
      </div>
      <div class="wizard-footer">
        <button class="settings-save-btn" id="createFinalBtn">${isChannel ? 'ساخت کانال' : 'ساخت گروه'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.getElementById('wizCloseBtn2').onclick = close;
  document.getElementById('wizBackBtn').onclick = () => { close(); openCreateChoice(); };

  // color picker
  const picker = document.getElementById('newColorPicker');
  const avatarPreview = document.getElementById('newAvatarPreview');
  gradients.forEach(g=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (state.color===g ? ' selected' : '');
    sw.style.background = g;
    sw.onclick = () => {
      state.color = g;
      avatarPreview.style.background = g;
      picker.querySelectorAll('.swatch').forEach(el=>el.classList.remove('selected'));
      sw.classList.add('selected');
    };
    picker.appendChild(sw);
  });

  const nameInput = document.getElementById('newNameInput');
  const bioInput = document.getElementById('newBioInput');
  const idInput = document.getElementById('newIdInput');
  const idHint = document.getElementById('newIdHint');
  const idFieldGroup = document.getElementById('idFieldGroup');
  const idFieldLabel = document.getElementById('idFieldLabel');
  const optPublic = document.getElementById('optPublic');
  const optPrivate = document.getElementById('optPrivate');

  nameInput.addEventListener('input', ()=>{
    avatarPreview.textContent = nameInput.value.trim() ? nameInput.value.trim().slice(0,2) : (isChannel?'ک':'گ');
  });

  function setVisibility(v){
    state.visibility = v;
    optPublic.classList.toggle('selected', v==='public');
    optPrivate.classList.toggle('selected', v==='private');
    idFieldGroup.style.display = 'block';
    if(v==='private'){
      idFieldLabel.textContent = 'آیدی خصوصی (تصادفی)';
      idInput.value = randomId(isChannel ? 'channel' : 'group');
      idInput.disabled = true;
      idHint.textContent = 'این آیدی به‌صورت خودکار و تصادفی ساخته شده و قابل تغییر نیست';
      idHint.className = 'field-hint';
      document.getElementById('reRandomBtn').style.display = 'inline-flex';
    } else {
      idFieldLabel.textContent = 'آیدی عمومی';
      idInput.disabled = false;
      idHint.textContent = 'آیدی باید یکتا باشد؛ حروف انگلیسی، عدد و آندرلاین';
      idHint.className = 'field-hint';
      document.getElementById('reRandomBtn').style.display = 'inline-flex';
    }
  }
  optPublic.onclick = () => setVisibility('public');
  optPrivate.onclick = () => setVisibility('private');

  idInput.addEventListener('input', ()=>{
    const cleaned = idInput.value.replace(/[^a-zA-Z0-9_]/g,'').toLowerCase();
    if(idInput.value !== cleaned) idInput.value = cleaned;
    if(cleaned.length < 4){
      idHint.textContent = 'آیدی باید حداقل ۴ کاراکتر باشد';
      idHint.className = 'field-hint taken';
    } else if(chats.some(c=>c.userId===cleaned)){
      idHint.textContent = 'این آیدی قبلاً استفاده شده است';
      idHint.className = 'field-hint taken';
    } else {
      idHint.textContent = 'این آیدی آزاد است ✓';
      idHint.className = 'field-hint ok';
    }
  });

  document.getElementById('reRandomBtn').onclick = () => {
    idInput.value = randomId(isChannel ? 'channel' : 'group');
    idInput.dispatchEvent(new Event('input'));
  };

  document.getElementById('createFinalBtn').onclick = () => {
    const name = nameInput.value.trim();
    if(!name){ showToast(isChannel ? 'نام کانال را وارد کنید' : 'نام گروه را وارد کنید'); return; }
    const finalId = idInput.value.trim() || randomId(isChannel ? 'channel' : 'group');
    if(finalId.length < 4){ showToast('آیدی معتبر نیست'); return; }
    if(chats.some(c=>c.userId===finalId)){ showToast('این آیدی قبلاً استفاده شده است'); return; }

    const newChat = {
      id: nextChatId++,
      userId: finalId,
      name: name,
      initials: name.slice(0,2),
      color: state.color,
      online: isChannel ? false : true,
      unread: 0,
      isGroup: true,
      type: isChannel ? 'channel' : 'group',
      visibility: state.visibility,
      isAdmin: true,
      members: isChannel ? '۱ عضو' : '۱ عضو (شما)',
      memberCount: 1,
      membersList: [
        {id:'owner', name: myProfile.name, initials: myProfile.initials, color: myProfile.color, role:'owner'}
      ],
      bio: bioInput.value.trim() || (isChannel ? 'کانال جدید' : 'گروه جدید'),
      joined: 'همین الان ساخته شد',
      messages: [
        {from:'them', text: isChannel ? `کانال «${name}» ساخته شد. اولین پست را منتشر کنید 🎉` : `گروه «${name}» ساخته شد. خوش آمدید! 🎉`, time: 'اکنون'}
      ]
    };
    chats.unshift(newChat);
    close();
    renderChatList(document.getElementById('searchInput').value);
    openChat(newChat.id);
    showToast((isChannel ? 'کانال' : 'گروه') + ' با موفقیت ساخته شد ✓');
  };

  setVisibility('public');
}

        <div class="profile-avatar-big" style="background:${c.color}">
          ${c.initials}
          ${c.online && !c.isGroup ? '<span class="dot"></span>' : ''}
        </div>
        <div class="profile-name">${c.name}</div>
        <div class="profile-status ${c.online ? '' : 'offline'}">${c.isGroup ? c.members : (c.online ? 'برخط' : 'آخرین بازدید اخیراً')}</div>

        <div class="profile-id-chip">
          آیدی: <b>@${c.userId}</b>
          <div class="id-copy-btn" id="copyIdBtn" title="کپی آیدی">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="1.8"/></svg>
          </div>
        </div>

        <div class="profile-info-list">
          ${infoRows}
          <div class="profile-info-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <div><div class="label">${c.isGroup ? 'تاریخ ساخت' : 'تاریخ عضویت'}</div><div class="value">${c.joined}</div></div>

        <div class="profile-actions">
          ${(c.isGroup && c.isAdmin) ? `
          <button class="btn-primary" id="profileSettingsBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 13.5a1.7 1.7 0 00.34 1.87l.06.06a2.06 2.06 0 11-2.92 2.92l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1.03 1.56V19.6a2.06 2.06 0 11-4.12 0v-.09a1.7 1.7 0 00-1.11-1.56 1.7 1.7 0 00-1.87.34l-.06.06a2.06 2.06 0 11-2.92-2.92l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.56-1.03H4.4a2.06 2.06 0 110-4.12h.09a1.7 1.7 0 001.56-1.11 1.7 1.7 0 00-.34-1.87l-.06-.06a2.06 2.06 0 112.92-2.92l.06.06a1.7 1.7 0 001.87.34h.06a1.7 1.7 0 001.03-1.56V4.4a2.06 2.06 0 114.12 0v.09a1.7 1.7 0 001.03 1.56h.06a1.7 1.7 0 001.87-.34l.06-.06a2.06 2.06 0 112.92 2.92l-.06.06a1.7 1.7 0 00-.34 1.87v.06a1.7 1.7 0 001.56 1.03h.19a2.06 2.06 0 110 4.12h-.09a1.7 1.7 0 00-1.56 1.03z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>

          </button>
          ` : ''}
          <button class="btn-ghost" id="profileCloseBtn2">بستن</button>
        </div>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target === overlay) close(); });
  document.getElementById('profileCloseBtn').onclick = close;
  document.getElementById('profileCloseBtn2').onclick = close;
  if(document.getElementById('profileSettingsBtn')) document.getElementById('profileSettingsBtn').onclick = () => { close(); openGroupChannelSettings(c.id); };

  document.getElementById('copyIdBtn').onclick = () => {
    const btn = document.getElementById('copyIdBtn');
    const text = '@' + c.userId;
    const done = () => {
      btn.classList.add('copied');
      btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      setTimeout(()=>{
        btn.classList.remove('copied');

      }, 1400);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(done);
    } else {
      done();
    }
  };

  const escHandler = (e) => { if(e.key==='Escape'){ close(); document.removeEventListener('keydown', escHandler); } };
  document.addEventListener('keydown', escHandler);
}

/* ---------- Group / Channel management (admin only) ---------- */

  const isChannel = c.type === 'channel';

  overlay.innerHTML = `
    <div class="wizard-modal">

          </div>

        </div>

        <div class="field-group">
          <label class="field-label">${isChannel ? 'نام کانال' : 'نام گروه'}</label>

        </div>

        <div class="field-group">
          <label class="field-label">نوع ${isChannel ? 'کانال' : 'گروه'}</label>
          <div class="radio-group">
            <div class="radio-option" id="gcsOptPublic">
              <div class="radio-dot"></div>
              <div class="radio-text">
                <div class="radio-title">عمومی</div>
                <div class="radio-sub">هر کسی با آیدی می‌تواند پیدا و عضو شود</div>
              </div>
            </div>
            <div class="radio-option" id="gcsOptPrivate">
              <div class="radio-dot"></div>
              <div class="radio-text">
                <div class="radio-title">خصوصی</div>
                <div class="radio-sub">فقط با لینک دعوت می‌توان عضو شد</div>
              </div>
            </div>
          </div>
        </div>

        <div class="field-group" id="gcsIdFieldGroup">
          <label class="field-label" id="gcsIdFieldLabel">آیدی</label>
          <div class="field-input-wrap id-field">
            <span class="at">@</span>
            <input id="gcsIdInput" type="text" maxlength="28" dir="ltr" value="${c.userId}" />
          </div>
          <div class="field-hint" id="gcsIdHint">حروف انگلیسی، عدد و آندرلاین مجاز است</div>
          <div class="id-suggest-chip" id="gcsRerandomBtn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>

      row.className = 'member-row';
      const roleLabel = m.role==='admin' ? '<span class="role-badge admin">ادمین</span>' : '';

        <div class="avatar" style="background:${m.color}">${m.initials}</div>
        <div class="m-info">
          <div class="m-name">${m.name} ${roleLabel}</div>

          </div>` : `<div class="m-action-btn" title="لغو ادمینی" data-action="demote" data-id="${m.id}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>`}
          <div class="m-action-btn danger" title="حذف از ${isChannel?'کانال':'گروه'}" data-action="remove" data-id="${m.id}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      `;
      membersWrap.appendChild(row);
    });

    membersWrap.querySelectorAll('.m-action-btn').forEach(btn=>{
      btn.onclick = () => {
        const action = btn.dataset.action;
        const mid = btn.dataset.id;
        const member = c.membersList.find(x=>x.id===mid);
        if(!member) return;
        if(action==='promote'){
          member.role = 'admin';
          showToast(`${member.name} ادمین شد ✓`);
        } else if(action==='demote'){
          member.role = 'member';
          showToast(`ادمینی ${member.name} لغو شد`);
        } else if(action==='remove'){
          if(confirm(`آیا از حذف ${member.name} از ${isChannel?'کانال':'گروه'} مطمئن هستید؟`)){
            c.membersList = c.membersList.filter(x=>x.id!==mid);
            c.memberCount = Math.max(1, (c.memberCount||1) - 1);
            c.members = isChannel ? `${toPersianDigits(c.memberCount)} عضو` : `${toPersianDigits(c.memberCount)} عضو`;
            renderMembersList();
            showToast(`${member.name} حذف شد`);
            return;
          } else { return; }
        }
        renderMembersList();
      };
    });
  }

  function toPersianDigits(n){
    const map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
    return String(n).replace(/[0-9]/g, d=>map[d]);
  }

  renderMembersList();

  document.getElementById('addAdminRow').onclick = () => {
    const nonAdmins = c.membersList.filter(m=>m.role!=='admin');
    if(nonAdmins.length===0){
      const name = prompt('نام عضو جدید برای افزودن به‌عنوان ادمین:');
      if(!name || !name.trim()) return;
      const newMember = { id:'m'+Date.now(), name:name.trim(), initials:name.trim().slice(0,2), color: gradients[Math.floor(Math.random()*gradients.length)], role:'admin' };
      c.membersList.push(newMember);
      c.memberCount = (c.memberCount||1) + 1;
      c.members = `${toPersianDigits(c.memberCount)} عضو`;
      renderMembersList();
      showToast(`${newMember.name} به‌عنوان ادمین اضافه شد ✓`);
      return;
    }
    const names = nonAdmins.map((m,i)=>`${i+1}. ${m.name}`).join('\n');
    const choice = prompt(`کدام عضو ادمین شود؟ عدد را وارد کنید:\n${names}\n\nیا نام یک عضو جدید بنویسید تا اضافه و ادمین شود.`);
    if(!choice || !choice.trim()) return;
    const idx = parseInt(choice.trim(), 10);
    if(!isNaN(idx) && idx>=1 && idx<=nonAdmins.length){
      nonAdmins[idx-1].role = 'admin';
      renderMembersList();
      showToast(`${nonAdmins[idx-1].name} ادمین شد ✓`);
    } else {
      const newMember = { id:'m'+Date.now(), name:choice.trim(), initials:choice.trim().slice(0,2), color: gradients[Math.floor(Math.random()*gradients.length)], role:'admin' };
      c.membersList.push(newMember);
      c.memberCount = (c.memberCount||1) + 1;
      c.members = `${toPersianDigits(c.memberCount)} عضو`;
      renderMembersList();
      showToast(`${newMember.name} به‌عنوان ادمین اضافه شد ✓`);
    }
  };

  const picker = document.getElementById('gcsColorPicker');
  const avatarPreview = document.getElementById('gcsAvatarPreview');
  gradients.forEach(g=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (state.color===g ? ' selected' : '');
    sw.style.background = g;
    sw.onclick = () => {
      state.color = g;
      avatarPreview.style.background = g;
      picker.querySelectorAll('.swatch').forEach(el=>el.classList.remove('selected'));
      sw.classList.add('selected');
    };
    picker.appendChild(sw);
  });

  const nameInput = document.getElementById('gcsNameInput');
  const bioInput = document.getElementById('gcsBioInput');
  const idInput = document.getElementById('gcsIdInput');
  const idHint = document.getElementById('gcsIdHint');
  const idLabel = document.getElementById('gcsIdFieldLabel');
  const optPublic = document.getElementById('gcsOptPublic');
  const optPrivate = document.getElementById('gcsOptPrivate');

  nameInput.addEventListener('input', ()=>{
    avatarPreview.textContent = nameInput.value.trim().slice(0,2) || c.initials;
  });

  function setVisibility(v, regenerateIfPrivate){
    state.visibility = v;
    optPublic.classList.toggle('selected', v==='public');
    optPrivate.classList.toggle('selected', v==='private');
    if(v==='private'){
      idLabel.textContent = 'آیدی خصوصی (تصادفی)';
      if(regenerateIfPrivate){
        idInput.value = randomId(isChannel ? 'channel' : 'group');
      }
      idInput.disabled = true;
      idHint.textContent = 'این آیدی تصادفی است و برای اعضای گروه/کانال قابل مشاهده نیست';
      idHint.className = 'field-hint';
    } else {
      idLabel.textContent = 'آیدی عمومی';
      idInput.disabled = false;
      idHint.textContent = 'حروف انگلیسی، عدد و آندرلاین مجاز است';
      idHint.className = 'field-hint';
    }
  }
  optPublic.onclick = () => setVisibility('public', false);
  optPrivate.onclick = () => setVisibility('private', true);
  setVisibility(c.visibility, false);

  idInput.addEventListener('input', ()=>{
    const cleaned = idInput.value.replace(/[^a-zA-Z0-9_]/g,'').toLowerCase();
    if(idInput.value !== cleaned) idInput.value = cleaned;
    if(cleaned.length < 4){
      idHint.textContent = 'آیدی باید حداقل ۴ کاراکتر باشد';
      idHint.className = 'field-hint taken';
    } else if(chats.some(x=>x.userId===cleaned && x.id!==c.id)){
      idHint.textContent = 'این آیدی قبلاً استفاده شده است';
      idHint.className = 'field-hint taken';
    } else {
      idHint.textContent = 'این آیدی آزاد است ✓';
      idHint.className = 'field-hint ok';
    }
  });

  document.getElementById('gcsRerandomBtn').onclick = () => {
    idInput.value = randomId(isChannel ? 'channel' : 'group');
    idInput.dispatchEvent(new Event('input'));
  };

  document.getElementById('gcsDeleteRow').onclick = () => {
    if(confirm(`آیا از حذف ${isChannel ? 'کانال' : 'گروه'} «${c.name}» مطمئن هستید؟ این عملیات غیرقابل بازگشت است.`)){
      chats = chats.filter(x=>x.id!==c.id);
      close();
      if(activeChat===c.id){ activeChat=null; appEl.classList.remove('chat-open'); renderEmptyChatPanel(); }
      renderChatList(document.getElementById('searchInput').value);
      showToast((isChannel ? 'کانال' : 'گروه') + ' حذف شد');
    }
  };

  document.getElementById('gcsSaveBtn').onclick = () => {
    const newName = nameInput.value.trim();
    if(!newName){ showToast('نام نمی‌تواند خالی باشد'); return; }
    const newId = idInput.value.trim();
    if(newId.length < 4){ showToast('آیدی معتبر نیست'); return; }
    if(chats.some(x=>x.userId===newId && x.id!==c.id)){ showToast('این آیدی قبلاً استفاده شده است'); return; }

    c.name = newName;
    c.initials = newName.slice(0,2);
    c.bio = bioInput.value.trim() || c.bio;
    c.color = state.color;
    c.visibility = state.visibility;
    c.userId = newId;

    close();
    renderChatList(document.getElementById('searchInput').value);
    if(activeChat===c.id) renderChatPanel(c);
    showToast('تغییرات ذخیره شد ✓');
  };

  const escHandler = (e) => { if(e.key==='Escape'){ close(); document.removeEventListener('keydown', escHandler); } };
  document.addEventListener('keydown', escHandler);
}

/* ---------- Chat header 3-dot menu: report / block / delete ---------- */
function closeCtxMenu(){
  const existing = document.getElementById('activeCtxMenu');
  if(existing) existing.remove();
  document.removeEventListener('click', outsideCtxClick, true);
  document.removeEventListener('keydown', ctxEscHandler);
}
function outsideCtxClick(e){
  const menu = document.getElementById('activeCtxMenu');
  if(menu && !menu.contains(e.target)) closeCtxMenu();
}
function ctxEscHandler(e){ if(e.key==='Escape') closeCtxMenu(); }

function openChatMenu(e, c){
  e.stopPropagation();
  closeCtxMenu();

  const items = [];
  if(!c.isGroup){
    items.push({
      label:'گزارش کاربر',
      icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L14.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      onClick: () => { closeCtxMenu(); openReportModal(c); }
    });
    items.push({
      label: c.blocked ? 'رفع مسدودیت کاربر' : 'مسدود کردن کاربر',
      icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 5.5l13 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      onClick: () => { closeCtxMenu(); toggleBlock(c); }
    });
    items.push({ sep:true });
  }
  items.push({
    label:'حذف گفتگو',
    danger:true,
    icon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    onClick: () => { closeCtxMenu(); openDeleteChatModal(c); }
  });

  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.id = 'activeCtxMenu';
  menu.innerHTML = items.map((it, idx) => it.sep
    ? `<div class="ctx-menu-sep"></div>`
    : `<div class="ctx-menu-item${it.danger ? ' danger':''}" data-idx="${idx}">${it.icon}<span>${it.label}</span></div>`
  ).join('');
  document.body.appendChild(menu);

  const rect = e.currentTarget.getBoundingClientRect();
  const menuWidth = 240;
  let left = rect.left + rect.width - menuWidth;
  if(left < 10) left = 10;
  if(left + menuWidth > window.innerWidth - 10) left = window.innerWidth - menuWidth - 10;
  let top = rect.bottom + 8;
  const menuHeightEstimate = items.length * 46 + 20;
  if(top + menuHeightEstimate > window.innerHeight - 10){
    top = Math.max(10, rect.top - menuHeightEstimate - 8);
  }
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';

  menu.querySelectorAll('.ctx-menu-item').forEach(el=>{
    const idx = parseInt(el.dataset.idx,10);
    el.addEventListener('click', (ev)=>{ ev.stopPropagation(); items[idx].onClick(); });
  });

  // Outside click closes the menu — attached on 'click' (bubble phase) on the NEXT tick
  // so it never races with the menu-item's own mousedown/click, and stopPropagation()
  // on the item (bubble phase) correctly prevents this handler from firing at all.
  setTimeout(()=>{
    document.addEventListener('click', outsideCtxClick, true);
    document.addEventListener('keydown', ctxEscHandler);
  },0);
}

function openReportModal(c){
  const reasons = ['هرزنامه یا تبلیغات', 'محتوای نامناسب یا توهین‌آمیز', 'مزاحمت یا آزار', 'حساب جعلی', 'کلاهبرداری', 'موردی دیگر'];
  let selectedReason = null;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="wizard-modal">
      <div class="wizard-head">
        <div class="title">گزارش ${c.name}</div>
        <div class="icon-btn" id="reportCloseBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      </div>
      <div class="wizard-body">
        <div class="field-label" style="margin-bottom:10px;">دلیل گزارش را انتخاب کنید</div>
        <div class="radio-group" id="reportReasonList">
          ${reasons.map((r,i)=>`
            <div class="radio-option" data-idx="${i}">
              <div class="radio-dot"></div>
              <div class="radio-text"><div class="radio-title">${r}</div></div>
            </div>
          `).join('')}
        </div>
        <textarea class="report-textarea" id="reportDetails" placeholder="توضیحات بیشتر (اختیاری)"></textarea>
      </div>
      <div class="wizard-footer">
        <button class="settings-save-btn" id="reportSubmitBtn" style="background:linear-gradient(135deg,#ff5c7a,#ff8a5c);">ارسال گزارش</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.getElementById('reportCloseBtn').onclick = close;

  const list = document.getElementById('reportReasonList');
  list.querySelectorAll('.radio-option').forEach(el=>{
    el.onclick = () => {
      list.querySelectorAll('.radio-option').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
      selectedReason = reasons[parseInt(el.dataset.idx,10)];
    };
  });

  document.getElementById('reportSubmitBtn').onclick = () => {
    if(!selectedReason){ showToast('لطفاً یک دلیل انتخاب کنید'); return; }
    close();
    showToast(`گزارش شما درباره ${c.name} ثبت شد ✓`);
  };

  const escHandler = (e) => { if(e.key==='Escape'){ close(); document.removeEventListener('keydown', escHandler); } };
  document.addEventListener('keydown', escHandler);
}

function toggleBlock(c){
  if(!c || c.isGroup) return;
  if(c.blocked){
    c.blocked = false;
    showToast(`مسدودیت ${c.name} رفع شد`);
  } else {
    if(!confirm(`آیا از مسدود کردن ${c.name} مطمئن هستید؟ دیگر نمی‌توانید برای این کاربر پیام ارسال کنید.`)) return;
    c.blocked = true;
    showToast(`${c.name} مسدود شد`);
  }
  persistChats();
  if(activeChat===c.id) renderChatPanel(c);
  renderChatList(document.getElementById('searchInput').value);
}

  overlay.innerHTML = `

      <div class="wizard-head">
        <div class="title">حذف گفتگو</div>
        <div class="icon-btn" id="delCloseBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      </div>
      <div class="wizard-body">

            <div class="dc-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

            </div>
          </div>
          <div class="delete-choice-btn" id="delForBothBtn">
            <div class="dc-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

  const close = () => overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.getElementById('delCloseBtn').onclick = close;

  function performDelete(msg){

    if(activeChat===c.id){

      appEl.classList.remove('chat-open');

    renderChatList(document.getElementById('searchInput').value);

    ev.stopPropagation();
    if(!confirm(`گفتگو با «${c.name}» برای همه حذف شود؟ این عملیات غیرقابل بازگشت است.`)) return;

        <button class="settings-save-btn" id="cancelLogoutBtn" style="background:rgba(255,255,255,0.06); box-shadow:none; color:var(--text-1);">انصراف</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.getElementById('cancelLogoutBtn').onclick = close;
  document.getElementById('confirmLogoutBtn').onclick = () => {
    close();
    doLogout();
  };
}

function doLogout(){
  isLoggedIn = false;
  appEl.style.display = 'none';
  activeChat = null;
  appEl.classList.remove('chat-open');
  showToast('با موفقیت خارج شدید');

  const avatarPreview = document.getElementById('editAvatarPreview');
  let pendingPhoto = myProfile.photo || null;
  let pendingColor = myProfile.color;

  function paintAvatarPreview(){
    if(pendingPhoto){
      avatarPreview.style.backgroundImage = `url('${pendingPhoto}')`;
      avatarPreview.style.background = `url('${pendingPhoto}') center/cover`;
      avatarPreview.textContent = '';
    } else {
      avatarPreview.style.backgroundImage = 'none';
      avatarPreview.style.background = pendingColor;
      avatarPreview.textContent = initialsFromName(nameInputVal());
    }
  }

  gradients.forEach((g)=>{
    const sw = document.createElement('div');
    sw.className = 'swatch' + (!pendingPhoto && myProfile.color===g ? ' selected' : '');
    sw.style.background = g;
    sw.onclick = () => {
      pendingPhoto = null;
      pendingColor = g;
      paintAvatarPreview();
      picker.querySelectorAll('.swatch').forEach(el=>el.classList.remove('selected'));
      sw.classList.add('selected');
    };
    picker.appendChild(sw);
  });

  const fileInput = document.getElementById('avatarFileInput');
  document.getElementById('avatarEditBtn').onclick = () => fileInput.click();
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){ showToast('فقط فایل تصویری مجاز است'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      pendingPhoto = ev.target.result;
      paintAvatarPreview();
      picker.querySelectorAll('.swatch').forEach(el=>el.classList.remove('selected'));
    };
    reader.readAsDataURL(file);
  });

  const nameInput = document.getElementById('nameInput');
  const idInput = document.getElementById('idInput');
  const idHint = document.getElementById('idHint');
  const saveBtn = document.getElementById('saveProfileBtn');

  function nameInputVal(){ return nameInput.value.trim() || 'کاربر'; }

  function initialsFromName(n){
    const parts = n.trim().split(/\s+/).filter(Boolean);
    if(parts.length===0) return '؟';
    if(parts.length===1) return parts[0].slice(0,2);
    return parts[0][0] + '‌' + parts[1][0];
  }

  nameInput.addEventListener('input', ()=>{
    if(!pendingPhoto) avatarPreview.textContent = initialsFromName(nameInputVal());
  });

  idInput.addEventListener('input', ()=>{
    const raw = idInput.value;
    const cleaned = raw.replace(/[^a-zA-Z0-9_]/g,'').toLowerCase();
    if(raw !== cleaned) idInput.value = cleaned;
    if(cleaned.length < 3){
      idHint.textContent = 'آیدی باید حداقل ۳ کاراکتر باشد';
      idHint.className = 'field-hint taken';
    } else {
      idHint.textContent = 'این آیدی معتبر است ✓';
      idHint.className = 'field-hint ok';
    }
  });

  saveBtn.onclick = () => {
    const newName = nameInput.value.trim();
    const newId = idInput.value.trim();
    if(!newName){ showToast('نام نمی‌تواند خالی باشد'); return; }
    if(newId.length < 3){ showToast('آیدی باید حداقل ۳ کاراکتر باشد'); return; }

    myProfile.name = newName;
    myProfile.userId = newId;
    myProfile.initials = initialsFromName(newName);
    myProfile.photo = pendingPhoto;
    myProfile.color = pendingColor;

    showToast('پروفایل ذخیره شد ✓');
    renderSettingsMain();
  };
}

function isValidEmail(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

function generateOtp(){
  return String(Math.floor(1000 + Math.random()*9000));
}

function initialsFromNameGlobal(n){
  const parts = (n||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return '؟';
  if(parts.length===1) return parts[0].slice(0,2);
  return parts[0][0] + '‌' + parts[1][0];
}

          <div class="auth-title">کد تأیید</div>
        </div>
        <div class="auth-sub" style="text-align:right; margin-bottom:20px;">کد ۴ رقمی ارسال‌شده به <b style="color:var(--text-1); direction:ltr; unicode-bidi:embed;">${email}</b> را وارد کنید</div>
        <div id="otpErrorSlot"></div>
        <div class="otp-inputs" id="otpInputs">
          <input maxlength="1" inputmode="numeric" />
          <input maxlength="1" inputmode="numeric" />
          <input maxlength="1" inputmode="numeric" />
          <input maxlength="1" inputmode="numeric" />
        </div>
        <div class="resend-row">کد را دریافت نکردید؟ <a id="resendOtp" class="disabled">ارسال مجدد (<span id="resendTimer">45</span>)</a></div>
        <button class="auth-btn" id="otpVerifyBtn">تأیید کد</button>
      </div>
    </div>
  `;
  document.getElementById('otpBackBtn').onclick = () => renderAuthForgotEmail(email);

  const inputs = Array.from(document.querySelectorAll('#otpInputs input'));
  inputs[0].focus();
  inputs.forEach((inp, i)=>{
    inp.addEventListener('input', ()=>{
      inp.value = inp.value.replace(/[^0-9]/g,'');
      if(inp.value && i < inputs.length-1) inputs[i+1].focus();
    });
    inp.addEventListener('keydown', (e)=>{
      if(e.key==='Backspace' && !inp.value && i>0) inputs[i-1].focus();
      if(e.key==='Enter') document.getElementById('otpVerifyBtn').click();
    });
    inp.addEventListener('paste', (e)=>{
      const text = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g,'').slice(0,4);
      if(text.length){
        e.preventDefault();
        text.split('').forEach((ch,idx)=>{ if(inputs[idx]) inputs[idx].value = ch; });
        inputs[Math.min(text.length,4)-1].focus();
      }
    });
  });

  function showErr(msg){
    document.getElementById('otpErrorSlot').innerHTML = `<div class="auth-error">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>${msg}</span>
    </div>`;
  }

  document.getElementById('otpVerifyBtn').onclick = () => {
    document.getElementById('otpErrorSlot').innerHTML = '';
    const code = inputs.map(i=>i.value).join('');
    if(code.length < 4){ showErr('کد ۴ رقمی را کامل وارد کنید'); return; }
    if(code !== pendingResetCode){ showErr('کد وارد شده صحیح نیست'); return; }
    renderAuthNewPassword(email);
  };

  const resendLink = document.getElementById('resendOtp');
  const timerSpan = document.getElementById('resendTimer');
  const timerInterval = setInterval(()=>{
    secondsLeft--;
    if(secondsLeft<=0){
      clearInterval(timerInterval);
      resendLink.classList.remove('disabled');
      resendLink.textContent = 'ارسال مجدد کد';
    } else {
      timerSpan.textContent = secondsLeft;
    }
  }, 1000);

  resendLink.onclick = () => {
    if(resendLink.classList.contains('disabled')) return;
    pendingResetCode = generateOtp();
    showToast(`کد جدید ارسال شد (نمایشی: ${pendingResetCode})`);
    renderAuthOtp(email);
  };
}

function renderAuthNewPassword(email){
  authRoot.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-back-row">
          <div class="auth-title">تعیین رمز عبور جدید</div>
        </div>
        <div class="auth-sub" style="text-align:right; margin-bottom:20px;">یک رمز عبور جدید برای حساب خود انتخاب کنید</div>
        <div id="npErrorSlot"></div>
        <div class="auth-field">
          <label>رمز عبور جدید</label>
          <div class="auth-input-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.7"/></svg>
            <input id="npPass" type="password" placeholder="حداقل ۶ کاراکتر" dir="ltr" />
            <svg class="toggle-pass" id="npPassToggle" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg>
          </div>
        </div>
        <div class="auth-field">
          <label>تکرار رمز عبور جدید</label>
          <div class="auth-input-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.7"/></svg>
            <input id="npPass2" type="password" placeholder="تکرار رمز عبور" dir="ltr" />
          </div>
        </div>
        <button class="auth-btn" id="npSaveBtn">ذخیره رمز جدید و ورود</button>
      </div>
    </div>
  `;

  const passInput = document.getElementById('npPass');
  document.getElementById('npPassToggle').onclick = () => {
    passInput.type = passInput.type === 'password' ? 'text' : 'password';
  };

  function showErr(msg){
    document.getElementById('npErrorSlot').innerHTML = `<div class="auth-error">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>${msg}</span>
    </div>`;
  }

  document.getElementById('npSaveBtn').onclick = () => {
    document.getElementById('npErrorSlot').innerHTML = '';
    const pass = passInput.value;
    const pass2 = document.getElementById('npPass2').value;
    if(pass.length < 6){ showErr('رمز عبور باید حداقل ۶ کاراکتر باشد'); return; }
    if(pass !== pass2){ showErr('تکرار رمز عبور مطابقت ندارد'); return; }

    if(registeredAccounts[email]){
      registeredAccounts[email].password = pass;
    }
    pendingResetEmail = null;
    pendingResetCode = null;

    showToast('رمز عبور با موفقیت تغییر کرد ✓');
    renderAuthLogin(email);
  };
}

function loginSuccess(){
  isLoggedIn = true;
  authRoot.innerHTML = '';
  appEl.style.display = 'grid';
  renderChatList();
  renderEmptyChatPanel();
  sidebarScroll.style.display = 'flex';
  settingsRoot.innerHTML = '';
  setNavActive('chats');
  appEl.classList.remove('chat-open');
}

/* ---------- Init ---------- */
restoreChats();
syncStreaks();
renderAuthLogin();
</script>
