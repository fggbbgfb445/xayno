<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیام‌رسان · GreenChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#040806;
    --bg-panel: rgba(12, 18, 15, 0.74);
    --bg-panel-solid:#0e1712;
    --stroke: rgba(180, 255, 210, 0.12);
    --accent-1:#2ee67d;
    --accent-2:#8ef5b9;
    --accent-grad: linear-gradient(135deg,#1fc96b 0%, #5eea9a 52%, #d8ffe8 100%);
    --text-1:#f1fff6;
    --text-2:#b3d9c2;
    --text-3:#6f8f7a;
    --bubble-them:#122018;
    --online:#57f39a;
    --danger:#ff6b71;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Vazirmatn', sans-serif;
    background: var(--bg-deep);
    color: var(--text-1);
    overflow:hidden;
    position:relative;
  }

  /* ---------- Aurora signature background ---------- */
  .aurora{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .aurora span{
    position:absolute; border-radius:50%;
    filter: blur(90px);
    opacity:0.35;
    mix-blend-mode: screen;
  }
  .aurora span:nth-child(1){
    width:520px; height:520px; background:#20d66c;
    top:-160px; right:-120px;
    opacity:0.42;
    animation: float1 22s ease-in-out infinite;
  }
  .aurora span:nth-child(2){
    width:460px; height:460px; background:#89f7b5;
    bottom:-160px; left:-100px;
    opacity:0.28;
    animation: float2 26s ease-in-out infinite;
  }
  .aurora span:nth-child(3){
    width:340px; height:340px; background:#b8ffd9;
    top:40%; left:35%;
    opacity:0.16;
    animation: float3 30s ease-in-out infinite;
  }
  @keyframes float1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-60px,80px) scale(1.15); }
  }
  @keyframes float2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(70px,-60px) scale(1.1); }
  }
  @keyframes float3{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(40px,40px) scale(0.9); }
  }
  @media (prefers-reduced-motion: reduce){
    .aurora span{ animation:none !important; }
  }

  /* ---------- App shell ---------- */
  .app{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns: 360px 1fr;
    height:100vh;
    max-width:1400px;
    margin:0 auto;
    padding:18px;
    gap:18px;
  }

  .panel{
    background: var(--bg-panel);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border:1px solid var(--stroke);
    border-radius: var(--radius-lg);
    display:flex; flex-direction:column;
    overflow:hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  /* ---------- Sidebar ---------- */
  .sidebar-head{
    padding:20px 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--stroke);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:19px; letter-spacing:0.2px;
  }
  .brand-mark{
    width:34px; height:34px; border-radius:11px;
    background: var(--accent-grad);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:800; color:#fff;
    box-shadow: 0 6px 18px rgba(124,92,255,0.45);
  }
  .icon-btn{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.04);
    border:1px solid var(--stroke);
    color: var(--text-2);
    cursor:pointer;
    transition: all .18s ease;
  }
  .icon-btn:hover{ background: rgba(255,255,255,0.09); color:var(--text-1); }

  .search-wrap{ padding:14px 16px; }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.04);
    border:1px solid var(--stroke);
    border-radius: 999px;
    padding:9px 14px;
  }
  .search-box input{
    background:none; border:none; outline:none;
    color:var(--text-1); font-family:inherit; font-size:14px; width:100%;
  }
  .search-box input::placeholder{ color:var(--text-3); }
  .search-box svg{ flex-shrink:0; opacity:0.6; }

  .chat-list{
    flex:1; overflow-y:auto; padding:4px 10px 14px;
  }
  .chat-item{
    display:flex; align-items:center; gap:12px;
    padding:11px 10px;
    border-radius: var(--radius-md);
    cursor:pointer;
    transition: background .15s ease;
    position:relative;
  }
  .chat-item:hover{ background: rgba(255,255,255,0.045); }
  .chat-item.active{ background: rgba(124,92,255,0.16); }
  .chat-item.active::before{
    content:'';
    position:absolute; right:0; top:14%; bottom:14%; width:3px;
    background: var(--accent-grad); border-radius:3px;
  }

  .avatar{
    position:relative; flex-shrink:0;
    width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:16px; color:#fff;
  }
  .avatar .dot{
    position:absolute; bottom:0; left:0;
    width:12px; height:12px; border-radius:50%;
    background: var(--online);
    border:2.5px solid var(--bg-panel-solid);
  }

  .chat-meta{ flex:1; min-width:0; }
  .chat-meta-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .chat-name{ font-size:14.5px; font-weight:600; color:var(--text-1); }
  .chat-time{ font-size:11.5px; color:var(--text-3); flex-shrink:0; }
  .chat-preview{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    margin-top:3px;
  }
  .chat-last{
    font-size:13px; color:var(--text-2);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .badge{
    background: var(--accent-grad);
    color:#fff; font-size:11px; font-weight:700;
    min-width:20px; height:20px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;
    padding:0 6px; flex-shrink:0;
  }

  /* ---------- Chat panel ---------- */
  .chat-panel{ display:flex; flex-direction:column; }
  .chat-head{
    padding:14px 22px;
    display:flex; align-items:center; gap:12px;
    border-bottom:1px solid var(--stroke);
  }
  .chat-user-toggle{
    display:flex; align-items:center; gap:12px;
    flex:1; min-width:0;
    padding:6px 8px;
    border-radius:16px;
    cursor:pointer;
    transition: background .16s ease;
  }
  .chat-user-toggle:hover{ background: rgba(255,255,255,0.03); }
  .chat-head .info{ flex:1; min-width:0; }
  .chat-head .name{ font-size:15px; font-weight:700; }
  .chat-head .status{ font-size:12.5px; color: var(--online); margin-top:2px; }
  .chat-head .status.offline{ color: var(--text-3); }
  .head-actions{ display:flex; gap:8px; }

  .profile-overlay{
    position:fixed; inset:0; z-index:40;
    display:none; align-items:center; justify-content:center;
    padding:24px; background: rgba(4, 8, 6, 0.56);
    backdrop-filter: blur(8px);
  }
  .profile-overlay.open{ display:flex; }
  .profile-panel{
    width:min(430px, 92vw);
    background: linear-gradient(180deg, rgba(17,24,18,0.96), rgba(10,15,12,0.96));
    border:1px solid var(--stroke);
    border-radius:24px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    overflow:hidden;
  }
  .profile-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 12px; border-bottom:1px solid var(--stroke);
  }
  .profile-header-title{ font-weight:700; font-size:16px; }
  .profile-body{ padding:20px; }
  .profile-hero{ display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  .profile-avatar{
    width:72px; height:72px; border-radius:20px; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:22px; color:#fff; background: var(--accent-grad);
    box-shadow: 0 14px 28px rgba(45, 196, 104, 0.28);
  }
  .profile-name-wrap{ min-width:0; }
  .profile-name{ font-size:20px; font-weight:800; }
  .profile-role{ color: var(--text-2); font-size:13px; margin-top:4px; }
  .profile-id-box{
    background: rgba(255,255,255,0.04); border:1px solid var(--stroke); border-radius:14px;
    padding:12px 14px; margin-bottom:16px;
  }
  .profile-label{ font-size:11px; color: var(--text-3); margin-bottom:6px; }
  .profile-id{ font-size:17px; font-weight:700; letter-spacing:0.6px; color: var(--text-1); }
  .profile-meta{ display:grid; gap:12px; }
  .meta-item{
    background: rgba(255,255,255,0.03); border:1px solid var(--stroke); border-radius:12px;
    padding:10px 12px;
  }
  .meta-item span{ display:block; font-size:11px; color: var(--text-3); margin-bottom:4px; }
  .meta-item strong{ font-size:14px; color: var(--text-1); }
  .profile-bio{
    background: rgba(255,255,255,0.03); border:1px solid var(--stroke); border-radius:12px;
    padding:12px; color: var(--text-2); line-height:1.8; font-size:13px;
  }

  .messages{
    flex:1; overflow-y:auto;
    padding:26px 30px;
    display:flex; flex-direction:column; gap:4px;
  }
  .day-divider{
    align-self:center;
    font-size:11.5px; color:var(--text-3);
    background: rgba(255,255,255,0.04);
    padding:5px 14px; border-radius:999px;
    margin: 14px 0 18px;
  }

  .msg-row{ display:flex; margin-bottom:2px; }
  .msg-row.me{ justify-content:flex-start; flex-direction:row-reverse; }
  .msg-row.them{ justify-content:flex-start; }

  .bubble{
    max-width:62%;
    padding:10px 15px 8px;
    font-size:14.5px; line-height:1.65;
    position:relative;
    animation: pop .22s ease;
  }
  @keyframes pop{
    from{ opacity:0; transform: translateY(6px) scale(0.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .msg-row.me .bubble{
    background: var(--accent-grad);
    color:#fff;
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 6px 16px rgba(124,92,255,0.28);
  }
  .msg-row.them .bubble{
    background: var(--bubble-them);
    border:1px solid var(--stroke);
    border-radius: 18px 18px 18px 4px;
  }
  .bubble .txt{ word-wrap:break-word; }
  .bubble .meta{
    display:flex; justify-content:flex-end; align-items:center; gap:4px;
    margin-top:4px; font-size:10.5px; opacity:0.75;
  }
  .msg-row.them .bubble .meta{ color:var(--text-3); }

  .typing-row .bubble{
    display:flex; align-items:center; gap:4px; padding:14px 16px;
  }
  .typing-dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--text-2);
    animation: blink 1.2s infinite;
  }
  .typing-dot:nth-child(2){ animation-delay:0.2s; }
  .typing-dot:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{
    0%,60%,100%{ opacity:0.3; transform: translateY(0); }
    30%{ opacity:1; transform: translateY(-3px); }
  }

  .composer{
    padding:16px 22px 20px;
    border-top:1px solid var(--stroke);
    display:flex; align-items:flex-end; gap:10px;
  }
  .composer-box{
    flex:1;
    background: rgba(255,255,255,0.045);
    border:1px solid var(--stroke);
    border-radius: 20px;
    padding:11px 16px;
    display:flex; align-items:center;
  }
  .composer-box textarea{
    flex:1; resize:none; background:none; border:none; outline:none;
    color:var(--text-1); font-family:inherit; font-size:14.5px;
    max-height:120px; line-height:1.5;
  }
  .composer-box textarea::placeholder{ color:var(--text-3); }

  .send-btn{
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    background: var(--accent-grad);
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px rgba(124,92,255,0.4);
    transition: transform .15s ease;
  }
  .send-btn:hover{ transform: scale(1.06); }
  .send-btn:active{ transform: scale(0.94); }

  /* scrollbars */
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.12); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text-3); gap:10px;
  }

  /* Mobile */
  .back-btn{ display:none; }
  @media (max-width: 860px){
    .app{ grid-template-columns: 1fr; padding:0; gap:0; height:100vh; }
    .panel{ border-radius:0; border:none; }
    .sidebar{ position:absolute; inset:0; z-index:3; transition: transform .28s ease; }
    .app.chat-open .sidebar{ transform: translateX(105%); }
    .chat-panel{ position:absolute; inset:0; z-index:2; }
    .back-btn{ display:flex; }
  }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>

<div class="app" id="app">
  <!-- SIDEBAR -->
  <div class="panel sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <div class="brand-mark">G</div>
        GreenChat
      </div>
      <div class="icon-btn" title="گفتگوی جدید">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="جستجو در گفتگوها" />
      </div>
    </div>
    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- CHAT PANEL -->
  <div class="panel chat-panel" id="chatPanel">
    <div id="chatContent" style="display:flex; flex-direction:column; height:100%;"></div>
  </div>
</div>

<div class="profile-overlay" id="profileOverlay"></div>

<script>
const gradients = [
  'linear-gradient(135deg,#7c5cff,#4f7bff)',
  'linear-gradient(135deg,#00d4ff,#3ee089)',
  'linear-gradient(135deg,#ff5c9d,#ff9a5c)',
  'linear-gradient(135deg,#ffb74a,#ff5c7a)',
  'linear-gradient(135deg,#5cffe1,#7c5cff)',
  'linear-gradient(135deg,#a06cff,#00d4ff)',
];

let chats = [
  {
    id: 1, userId: 'GCH-2041', name: 'مریم احمدی', initials: 'م‌ا', color: gradients[0], online: true, unread: 2,
    role: 'طراح تجربه کاربری',
    bio: 'من به طراحی رابط‌های کاربری و تجربه‌های روان و ساده علاقه‌مندم. دوست دارم محصولات را به زبان کاربران نزدیک کنم.',
    email: 'm.ahmadi@greenchat.ir',
    location: 'تهران, ایران',
    messages: [
      {from:'them', text:'سلام! پروژه رو دیدی؟', time:'10:12'},
      {from:'me', text:'سلام مریم جان، آره الان دارم نگاش می‌کنم', time:'10:14'},
      {from:'them', text:'عالیه، نظرت راجع به بخش طراحی چیه؟', time:'10:15'},
      {from:'them', text:'فکر کنم رنگ‌بندیش خیلی خوب از آب دراومده', time:'10:15'},
    ]
  },
  {
    id: 2, userId: 'GCH-1187', name: 'گروه توسعه‌دهنده‌ها', initials: 'گت', color: gradients[1], online:false, unread: 0,
    role: 'تیم فنی',
    bio: 'گروه توسعه برای پیاده‌سازی نسخه جدید پلتفرم و رفع ایرادهای فنی در حال همکاری هستند.',
    email: 'devteam@greenchat.ir',
    location: 'شیراز, ایران',
    messages: [
      {from:'them', text:'دیپلوی نسخه جدید انجام شد ✅', time:'09:40'},
      {from:'me', text:'دمتون گرم، تست می‌کنم', time:'09:42'},
    ]
  },
  {
    id: 3, userId: 'GCH-7392', name: 'علی رضایی', initials: 'ع‌ر', color: gradients[2], online:true, unread: 0,
    role: 'کارآفرین دیجیتال',
    bio: 'به ساخت محصولات کاربردی و ساده برای استفاده کاربران علاقه دارم و همیشه به جزئیات مهم توجه می‌کنم.',
    email: 'ali.r@greenchat.ir',
    location: 'اصفهان, ایران',
    messages: [
      {from:'me', text:'فردا ساعت چند بریم بیرون؟', time:'یک روز پیش'},
      {from:'them', text:'بذار ساعت ۷ باشه بهتره', time:'یک روز پیش'},
    ]
  },
  {
    id: 4, userId: 'GCH-9914', name: 'سارا محمدی', initials: 'س‌م', color: gradients[3], online:false, unread: 5,
    role: 'مدیر محصول',
    bio: 'مدیر محصولی که ترجیح می‌دهد روی نیاز کاربران و بهبود تجربه تمرکز کند.',
    email: 'sara.m@greenchat.ir',
    location: 'تبریز, ایران',
    messages: [
      {from:'them', text:'فایل رو برات فرستادم', time:'دیروز'},
      {from:'them', text:'یه نگاه بنداز ببین درسته یا نه', time:'دیروز'},
    ]
  },
  {
    id: 5, userId: 'GCH-5510', name: 'کانال طراحی', initials: 'ک‌ط', color: gradients[4], online:false, unread: 12,
    role: 'کانال الهام‌گیری',
    bio: 'مجموعه‌ای از ایده‌های طراحی و پالت‌های جدید برای الهام گرفتن در پروژه‌های بصری.',
    email: 'design@greenchat.ir',
    location: 'مشهد, ایران',
    messages: [
      {from:'them', text:'الهام بگیرید از این پالت رنگی جدید 🎨', time:'۲ روز پیش'},
    ]
  },
  {
    id: 6, userId: 'GCH-3826', name: 'حسین کریمی', initials: 'ح‌ک', color: gradients[5], online:true, unread: 0,
    role: 'توسعه‌دهنده فرانت‌اند',
    bio: 'توسعه‌دهنده‌ای که عاشق ساخت رابط‌های تمیز، سریع و قابل‌به‌کارگیری برای مردم است.',
    email: 'hossein.k@greenchat.ir',
    location: 'کرج, ایران',
    messages: [
      {from:'them', text:'ممنون بابت کمکت 🙏', time:'۳ روز پیش'},
      {from:'me', text:'خواهش می‌کنم، هر وقت خواستی بگو', time:'۳ روز پیش'},
    ]
  },
];

const autoReplies = [
  'باشه، حتما بررسی می‌کنم 👍',
  'آها متوجه شدم، ممنون که گفتی',
  'خیلی خوبه! کِی وقت داری در موردش صحبت کنیم؟',
  'اوکی دریافت شد ✅',
  'جالبه، بیشتر برام توضیح بده',
];

let activeChat = null;
const chatListEl = document.getElementById('chatList');
const chatContent = document.getElementById('chatContent');
const appEl = document.getElementById('app');

function renderChatList(filter=''){
  chatListEl.innerHTML = '';
  chats
    .filter(c => c.name.includes(filter))
    .forEach(c => {
      const last = c.messages[c.messages.length-1];
      const div = document.createElement('div');
      div.className = 'chat-item' + (activeChat===c.id ? ' active' : '');
      div.onclick = () => openChat(c.id);
      div.innerHTML = `
        <div class="avatar" style="background:${c.color}">
          ${c.initials}
          ${c.online ? '<span class="dot"></span>' : ''}
        </div>
        <div class="chat-meta">
          <div class="chat-meta-top">
            <span class="chat-name">${c.name}</span>
            <span class="chat-time">${last.time}</span>
          </div>
          <div class="chat-preview">
            <span class="chat-last">${last.from==='me' ? 'شما: ' : ''}${last.text}</span>
            ${c.unread>0 ? `<span class="badge">${c.unread}</span>` : ''}
          </div>
        </div>
      `;
      chatListEl.appendChild(div);
    });
}

function openChat(id){
  activeChat = id;
  const c = chats.find(x=>x.id===id);
  c.unread = 0;
  appEl.classList.add('chat-open');
  renderChatList(document.getElementById('searchInput').value);
  renderChatPanel(c);
}

function renderProfile(c){
  const overlay = document.getElementById('profileOverlay');
  overlay.innerHTML = `
    <div class="profile-panel" role="dialog" aria-modal="true">
      <div class="profile-header">
        <div class="profile-header-title">پروفایل</div>
        <button class="icon-btn" id="closeProfileBtn" title="بستن">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="profile-body">
        <div class="profile-hero">
          <div class="profile-avatar" style="background:${c.color}">${c.initials}</div>
          <div class="profile-name-wrap">
            <div class="profile-name">${c.name}</div>
            <div class="profile-role">${c.role}</div>
          </div>
        </div>
        <div class="profile-id-box">
          <div class="profile-label">شناسه کاربر</div>
          <div class="profile-id">${c.userId}</div>
        </div>
        <div class="profile-bio">${c.bio}</div>
        <div class="profile-meta" style="margin-top:16px;">
          <div class="meta-item">
            <span>موقعیت</span>
            <strong>${c.location}</strong>
          </div>
          <div class="meta-item">
            <span>ایمیل</span>
            <strong>${c.email}</strong>
          </div>
          <div class="meta-item">
            <span>وضعیت</span>
            <strong>${c.online ? 'برخط' : 'آفلاین'}</strong>
          </div>
        </div>
      </div>
    </div>
  `;
  overlay.classList.add('open');
  document.getElementById('closeProfileBtn').onclick = () => overlay.classList.remove('open');
  overlay.onclick = (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  };
}

function renderChatPanel(c){
  chatContent.innerHTML = `
    <div class="chat-head">
      <div class="icon-btn back-btn" id="backBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="chat-user-toggle" id="profileTrigger" title="نمایش پروفایل">
        <div class="avatar" style="width:40px;height:40px;font-size:14px;background:${c.color}">
          ${c.initials}
          ${c.online ? '<span class="dot" style="width:10px;height:10px;"></span>' : ''}
        </div>
        <div class="info">
          <div class="name">${c.name}</div>
          <div class="status ${c.online ? '' : 'offline'}">${c.online ? 'برخط' : 'آخرین بازدید اخیراً'}</div>
        </div>
      </div>
      <div class="head-actions">
        <div class="icon-btn" title="تماس"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.68 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0122 16.92z" stroke="currentColor" stroke-width="2"/></svg></div>
        <div class="icon-btn" id="profileBtn" title="پروفایل کامل"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/></svg></div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <div class="composer-box">
        <textarea id="msgInput" rows="1" placeholder="پیام بنویسید..."></textarea>
      </div>
      <button class="send-btn" id="sendBtn">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 2l-7 20-4-9-9-4 20-7z" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  `;
  document.getElementById('backBtn').onclick = () => appEl.classList.remove('chat-open');
  document.getElementById('profileTrigger').onclick = () => renderProfile(c);
  document.getElementById('profileBtn').onclick = () => renderProfile(c);
  renderMessages(c);

  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const send = () => sendMessage(c, input);
  sendBtn.onclick = send;
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  input.addEventListener('input', ()=>{
    input.style.height='auto';
    input.style.height = Math.min(input.scrollHeight,120)+'px';
  });
}

function renderMessages(c){
  const wrap = document.getElementById('messages');
  wrap.innerHTML = '<div class="day-divider">امروز</div>';
  c.messages.forEach(m => {
    wrap.innerHTML += `
      <div class="msg-row ${m.from}">
        <div class="bubble">
          <div class="txt">${m.text}</div>
          <div class="meta">${m.time}${m.from==='me' ? ' · ✓✓' : ''}</div>
        </div>
      </div>
    `;
  });
  wrap.scrollTop = wrap.scrollHeight;
}

function sendMessage(c, input){
  const text = input.value.trim();
  if(!text) return;
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  c.messages.push({from:'me', text, time});
  input.value='';
  input.style.height='auto';
  renderMessages(c);
  renderChatList(document.getElementById('searchInput').value);

  const wrap = document.getElementById('messages');
  const typingRow = document.createElement('div');
  typingRow.className = 'msg-row them typing-row';
  typingRow.innerHTML = `<div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
  setTimeout(()=>{
    wrap.appendChild(typingRow);
    wrap.scrollTop = wrap.scrollHeight;
  }, 500);

  setTimeout(()=>{
    typingRow.remove();
    const reply = autoReplies[Math.floor(Math.random()*autoReplies.length)];
    const rNow = new Date();
    const rTime = rNow.getHours().toString().padStart(2,'0')+':'+rNow.getMinutes().toString().padStart(2,'0');
    c.messages.push({from:'them', text:reply, time:rTime});
    renderMessages(c);
    renderChatList(document.getElementById('searchInput').value);
  }, 1900);
}

document.getElementById('searchInput').addEventListener('input', e=>{
  renderChatList(e.target.value);
});

renderChatList();
chatContent.innerHTML = `
  <div class="empty-state">
    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" opacity="0.5"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="currentColor" stroke-width="1.5"/></svg>
    <p>یک گفتگو برای شروع انتخاب کنید</p>
  </div>
`;
</script>

</body>
</html>
